name: Update README Time

on:
  workflow_dispatch:
  schedule:
    - cron: '1 1 * * 1'

jobs:
  update-readme:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4      
      
      - name: Set timezone and get current time
        id: time
        run: |
          echo "CURRENT_TIME=$(TZ='Asia/Singapore' date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Update readme.txt
        run: |
          echo "Last updated time: ${{ steps.time.outputs.CURRENT_TIME }}" > readme.txt            

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add readme.txt          
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update readme time [skip ci]" && git push)
